# Render blueprint for the API.
#
# The API is a long-running web service rather than a serverless function
# because a generation takes about ninety seconds and the in-process job queue
# needs a process that stays alive between requests.
services:
  - type: web
    name: interview-prep-kit-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build:api
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production        # this alone blocks private-address fetching
      - key: MONGODB_URI
        sync: false              # set in the dashboard; never committed
      - key: AUTH_JWT_SECRET
        generateValue: true      # 32+ random bytes, generated by Render
      - key: GROQ_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: lax
